[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-continuity-engine"
version = "0.1.0"
description = "Offline, provenance-aware persona conditioning compiler"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pce = "pce.__main__:main"

[tool.setuptools.packages.find]
include = ["pce*"]

[project.optional-dependencies]
tokenizer = ["tokenizers>=0.15,<1.0"]
